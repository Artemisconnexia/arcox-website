<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement — Kiff Me</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F0A1E;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1A1030;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    .icon.success { background: linear-gradient(135deg, #6C3FC5, #F472B6); }
    .icon.cancelled { background: rgba(255,255,255,0.1); }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #FF4E8C, #7B2FBE);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 15px;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF4E8C, #7B2FBE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Kiff Me 🔥</div>
    <div class="icon success" id="icon">✅</div>
    <h1 id="title">Paiement traité !</h1>
    <p id="message">Ton paiement a bien été pris en compte. Retourne dans l'application pour profiter de ton abonnement.</p>
    <a href="kiffme://" class="btn">Retourner dans l'app</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const message = document.getElementById('message');

    if (status === 'canceled' || status === 'declined') {
      icon.className = 'icon cancelled';
      icon.textContent = '❌';
      title.textContent = 'Paiement annulé';
      message.textContent = "Ton paiement a été annulé ou refusé. Tu peux réessayer depuis l'application.";
    } else if (status === 'approved') {
      icon.className = 'icon success';
      icon.textContent = '✅';
      title.textContent = 'Paiement réussi !';
      message.textContent = "Ton paiement a bien été confirmé. Retourne dans l'application pour profiter de ton abonnement 🎉";
    } else {
      icon.textContent = '⏳';
      title.textContent = 'Paiement en cours...';
      message.textContent = "Ton paiement est en cours de traitement. Retourne dans l'application pour vérifier ton statut.";
    }
  </script>
</body>
</html>
