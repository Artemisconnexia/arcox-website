<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiff Me — Action email</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F0A1E;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1A1030;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    .icon.success { background: linear-gradient(135deg, #6C3FC5, #F472B6); }
    .icon.error { background: rgba(255,255,255,0.1); }
    .icon.loading { background: linear-gradient(135deg, #6C3FC5, #F472B6); }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #FF4E8C, #7B2FBE);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn:hover { opacity: 0.9; }
    .btn.secondary {
      background: rgba(255,255,255,0.1);
      margin-top: 12px;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF4E8C, #7B2FBE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 32px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      color: white;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.4); }
    input:focus { border-color: #FF4E8C; }
    .error-msg { color: #FF4E8C; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Kiff Me 💘</div>
    <div class="icon loading" id="icon">
      <div class="spinner" id="spinner"></div>
    </div>
    <h1 id="title">Chargement...</h1>
    <p id="message">Patiente un instant...</p>
    <div id="content"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, applyActionCode, confirmPasswordReset, verifyPasswordResetCode } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAu7WCuI5NjM6Ntt93hfDHGRAwch2Xu8zs",
      authDomain: "kiff-me-3008f.firebaseapp.com",
      projectId: "kiff-me-3008f",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const icon = document.getElementById('icon');
    const spinner = document.getElementById('spinner');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const content = document.getElementById('content');

    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');

    function setIcon(type, emoji) {
      icon.className = `icon ${type}`;
      spinner.style.display = 'none';
      icon.textContent = emoji;
    }

    function showSuccess(t, msg, btnText, btnHref) {
      setIcon('success', '✅');
      title.textContent = t;
      message.textContent = msg;
      content.innerHTML = `<a href="${btnHref}" class="btn">${btnText}</a>`;
    }

    function showError(t, msg) {
      setIcon('error', '❌');
      title.textContent = t;
      message.textContent = msg;
      content.innerHTML = `<a href="kiffme://" class="btn">Retourner dans l'app</a>`;
    }

    // ── Mode vérification email ──
    if (mode === 'verifyEmail' && oobCode) {
      applyActionCode(auth, oobCode)
        .then(() => showSuccess(
          'Email vérifié ! 🎉',
          'Ton adresse email a été vérifiée avec succès. Tu peux maintenant utiliser Kiff Me !',
          'Ouvrir Kiff Me 💘',
          'kiffme://email/verified'
        ))
        .catch(() => showError(
          'Lien invalide',
          'Ce lien de vérification est invalide ou a expiré. Demande un nouvel email depuis l\'application.'
        ));
    }

    // ── Mode réinitialisation mot de passe ──
    else if (mode === 'resetPassword' && oobCode) {
      verifyPasswordResetCode(auth, oobCode)
        .then(() => {
          setIcon('success', '🔒');
          title.textContent = 'Nouveau mot de passe';
          message.textContent = 'Choisis un nouveau mot de passe pour ton compte Kiff Me.';
          content.innerHTML = `
            <input type="password" id="pwd1" placeholder="Nouveau mot de passe" />
            <input type="password" id="pwd2" placeholder="Confirme le mot de passe" />
            <p class="error-msg" id="err"></p>
            <button class="btn" onclick="resetPwd()">Enregistrer 🔒</button>
          `;
          window.resetPwd = async () => {
            const pwd1 = document.getElementById('pwd1').value;
            const pwd2 = document.getElementById('pwd2').value;
            const err = document.getElementById('err');
            if (pwd1.length < 6) { err.textContent = 'Le mot de passe doit faire au moins 6 caractères'; return; }
            if (pwd1 !== pwd2) { err.textContent = 'Les mots de passe ne correspondent pas'; return; }
            try {
              await confirmPasswordReset(auth, oobCode, pwd1);
              showSuccess(
                'Mot de passe modifié ! ✅',
                'Ton mot de passe a été mis à jour. Tu peux maintenant te connecter.',
                'Se connecter 💘',
                'kiffme://login'
              );
            } catch (e) {
              err.textContent = 'Erreur. Ce lien est peut-être expiré.';
            }
          };
        })
        .catch(() => showError(
          'Lien invalide',
          'Ce lien de réinitialisation est invalide ou a expiré. Demande un nouveau lien depuis l\'application.'
        ));
    }

    // ── Mode récupération email ──
    else if (mode === 'recoverEmail' && oobCode) {
      applyActionCode(auth, oobCode)
        .then(() => showSuccess(
          'Email restauré ! ✅',
          'Ton adresse email précédente a été restaurée avec succès.',
          'Retourner dans l\'app',
          'kiffme://'
        ))
        .catch(() => showError(
          'Lien invalide',
          'Ce lien est invalide ou a expiré.'
        ));
    }

    // ── Mode inconnu ──
    else {
      showError('Lien invalide', 'Ce lien est invalide ou manquant.');
    }
  </script>
</body>
</html>
